<!DOCTYPE html>
<html lang="en" class="is-loading">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ACCOOM — Find Accommodation. Connect. Secure. Move in.</title>
  <link rel="icon" href="assets/images/accoom-dark-logo.webp" />
  <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('accoom-theme'));
        if (t === 'dark') document.documentElement.classList.add('dark-mode');
      } catch (e) {
        document.documentElement.classList.add('dark-mode');
      }
    })();
  </script>

  <!-- auth-state: tags <html> as guest / signed-in BEFORE first paint so account-only
       parts of the header (balance, messages, notifications, agent CTA) never flash. -->
  <script>
    (function () {
      try {
        var u = JSON.parse(localStorage.getItem('accoom-user')), c = document.documentElement.classList;
        if (!u) c.add('is-guest');
        else { c.add('is-auth'); if (u.role === 'agent' && u.agentProfileCompleted) c.add('is-agent-done'); }
      } catch (e) { document.documentElement.classList.add('is-guest'); }
    })();
  </script>

  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/pages/load-page.css" />

  <!-- While the splash is showing, quietly fetch what home.html needs,
       so the page appears instantly when the splash ends. -->
  <link rel="prefetch" href="home.html" as="document" />
  <link rel="prefetch" href="assets/css/pages/home.css" as="style" />
  <link rel="prefetch" href="partials/header.html" as="fetch" crossorigin />
  <link rel="prefetch" href="partials/footer.html" as="fetch" crossorigin />
</head>
<body>

<div id="load-page" role="status" aria-live="polite">
  <div class="load-page__mark">
    <img
      src="assets/images/accoom-dark-logo.webp"
      alt="ACCOOM"
      class="load-page__logo"
    />
    <span class="load-page__horizon" aria-hidden="true"></span>
    <h1 class="load-page__title">Welcome to ACCOOM</h1>
  </div>
</div>

<!-- The splash only needs its own script. The shared core/theme scripts
     were removed here because nothing on this page uses them. -->
<script src="assets/js/pages/load-page.js"></script>

</body>
</html>
