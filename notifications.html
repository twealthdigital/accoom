<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Notifications — ACCOOM</title>
  <link rel="icon" href="assets/images/accoom-dark-logo.webp" />
  <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('accoom-theme'));
        if (t === 'dark') document.documentElement.classList.add('dark-mode');
      } catch (e) {
        document.documentElement.classList.add('dark-mode');
      }
    })();
  </script>

  <!-- auth-state: tags <html> as guest / signed-in BEFORE first paint so account-only
       parts of the header (balance, messages, notifications, agent CTA) never flash. -->
  <script>
    (function () {
      try {
        var u = JSON.parse(localStorage.getItem('accoom-user')), c = document.documentElement.classList;
        if (!u) c.add('is-guest');
        else { c.add('is-auth'); if (u.role === 'agent' && u.agentProfileCompleted) c.add('is-agent-done'); }
      } catch (e) { document.documentElement.classList.add('is-guest'); }
    })();
  </script>

  <script>
    (function () {
      try {
        var user = JSON.parse(localStorage.getItem('accoom-user'));
        if (!user) window.location.replace('auth.html');
      } catch (e) {
        window.location.replace('auth.html');
      }
    })();
  </script>

  <!-- early-partials: paints header/footer immediately (see assets/js/core/partials.js) -->
  <script>
    (function () {
      try {
        var PREFIX = 'accoom-partial:', pending = {};
        var load = function (url) {
          if (pending[url]) return pending[url];
          var cached = null;
          try { cached = window.sessionStorage.getItem(PREFIX + url); } catch (e) {}
          var net = fetch(url, { priority: 'high' }).then(function (r) {
            if (!r.ok) throw new Error(url);
            return r.text();
          }).then(function (html) {
            try { window.sessionStorage.setItem(PREFIX + url, html); } catch (e) {}
            return html;
          });
          if (cached) { net.catch(function () {}); pending[url] = Promise.resolve(cached); }
          else { pending[url] = net; }
          return pending[url];
        };
        var scan = function (root) {
          var list = root.querySelectorAll('[data-partial]');
          for (var i = 0; i < list.length; i++) claim(list[i]);
        };
        var claim = function (el) {
          if (el.__early) return;
          var url = el.getAttribute('data-partial');
          if (!url) return;
          el.__early = load(url).then(function (html) {
            if (el.getAttribute('data-partial') !== url) return;
            el.innerHTML = html;
            el.setAttribute('data-early', '1');
            scan(el);
          }, function () {});
        };
        load('partials/header.html');
        load('partials/footer.html');
        var mo = new MutationObserver(function () { scan(document); });
        mo.observe(document.documentElement, { childList: true, subtree: true });
        document.addEventListener('DOMContentLoaded', function () { scan(document); mo.disconnect(); });
      } catch (e) { /* older browser: the normal loader still works */ }
    })();
  </script>

  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/pages/notifications.css" />
</head>
<body>

  <div class="partial-mount" data-partial="partials/header.html"></div>

  <main class="notif-page">
    <div class="container notif-page-inner">

      <div class="notif-page-head">
        <div>
          <h1>Notifications</h1>
          <p>Everything that's happened on your account.</p>
        </div>
        <div class="dropdown notif-options-dropdown" id="notif-options-dropdown">
          <button type="button" class="notif-options-trigger dropdown-trigger" aria-haspopup="true" aria-expanded="false" aria-label="Notification options">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
          </button>
          <ul class="dropdown-panel notif-options-panel" role="listbox" data-dropdown-panel>
            <li role="option" data-value="mark-all-read">Mark all as read</li>
            <li role="option" data-value="mute" data-notif-mute-option>Mute</li>
          </ul>
        </div>
      </div>

      <div class="notif-page-tabs" role="tablist">
        <button type="button" class="notif-page-tab is-active" data-notif-page-tab="all" role="tab" aria-selected="true">All</button>
        <button type="button" class="notif-page-tab" data-notif-page-tab="unread" role="tab" aria-selected="false">Unread</button>
      </div>

      <div class="notif-page-list" data-notif-page-list></div>

      <p class="notif-page-empty" data-notif-page-empty hidden>No notifications to show.</p>

    </div>
  </main>

  <div data-partial="partials/footer.html"></div>

  <script src="assets/js/core/dom.js"></script>
  <script src="assets/js/core/events.js"></script>
  <script src="assets/js/core/storage.js"></script>
  <script src="assets/js/core/wallet.js"></script>
  <script src="assets/js/core/skeleton.js"></script>
  <script src="assets/js/core/partials.js"></script>
  <script src="assets/js/data/pricing.js"></script>
  <script src="assets/js/data/listing-review.js"></script>
  <script src="assets/js/data/reviews.js"></script>
  <script src="assets/js/data/properties.js"></script>
  <script src="assets/js/data/notifications.js"></script>
  <script src="assets/js/modules/dropdown.js"></script>
  <script src="assets/js/modules/offcanvas.js"></script>
  <script src="assets/js/modules/theme.js"></script>
  <script src="assets/js/modules/location.js"></script>
  <script>Accoom.loadPartials();</script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/pages/notifications.js"></script>
</body>
</html>
