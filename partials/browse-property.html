<div class="browse-property" data-browse-overlay>
  <div class="browse-property-mask" data-browse-mask aria-hidden="true"></div>
  <div class="container browse-property-inner">
    <div class="browse-property-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.6" y2="16.6"></line>
      </svg>
      <input type="search" class="browse-property-input" data-browse-input placeholder="Search by property, location or type" aria-label="Search all properties" />
      <button type="button" class="browse-property-close" data-browse-close aria-label="Close search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <div class="browse-property-results" data-browse-results></div>
    <p class="browse-property-empty" data-browse-empty>Sorry, No properties match your search</p>
  </div>
</div>
