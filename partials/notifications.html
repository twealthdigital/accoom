<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!-- =========================================================
     NOTIFICATIONS DROPDOWN
     Items are rendered entirely by main.js from
     Accoom.NotificationService — nothing here is hardcoded.
============================================================= -->
<div class="dropdown notif-dropdown">
  <button type="button" class="notif-trigger dropdown-trigger has-unread" aria-haspopup="true" aria-expanded="false" aria-label="Notifications">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>
    <span class="notif-trigger-label">Notifications</span>
    <span class="notif-badge-dot" data-notif-badge></span>
    <span class="notif-badge-count" data-notif-count>0</span>
  </button>

  <div class="dropdown-panel notif-panel" data-dropdown-panel>
    <div class="notif-panel-header">
      <h4>Notifications</h4>
    </div>

    <div class="notif-list" data-notif-list>
      <div class="notif-empty" data-notif-empty>No Notifications</div>
    </div>

    <a href="notifications.html" class="notif-panel-footer">View all notifications</a>
  </div>
</div>
</body>
</html>
