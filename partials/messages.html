<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!-- =========================================================
     MESSAGES DROPDOWN
     TODO(backend): msg-list below is hardcoded — swap for
     items rendered from the messaging API when it's ready.
============================================================= -->
<div class="dropdown msg-dropdown">
  <button type="button" class="msg-trigger notif-trigger dropdown-trigger has-unread" aria-haspopup="true" aria-expanded="false" aria-label="Messages">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
    <span class="notif-trigger-label">Messages</span>
    <span class="notif-badge-dot" data-msg-badge></span>
    <span class="notif-badge-count" data-msg-count>0</span>
  </button>

  <div class="dropdown-panel notif-panel msg-panel" data-dropdown-panel>
    <div class="notif-panel-header">
      <h4>Messages</h4>
    </div>

    <div class="notif-list" data-msg-list>

      <div class="notif-empty" data-msg-empty>No Messages</div>

    </div>

    <a href="contact-agent.html" class="notif-panel-footer">View all messages</a>
  </div>
</div>
</body>
</html>
